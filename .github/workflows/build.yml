name: Build inventory-service
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Run unit tests and coverage
        run: mvn -B -f inventory-service/pom.xml test jacoco:report
      - name: Build container image
        run: docker build -t ghcr.io/northstar/inventory-service:${{ github.sha }} inventory-service
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f k8s/
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with: {name: jacoco-report, path: inventory-service/target/site/jacoco}
