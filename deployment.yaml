apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-api
  namespace: payments-production
  labels:
    app.kubernetes.io/name: settlement-api
    app.kubernetes.io/version: 2.8.0
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-api
        app.kubernetes.io/version: 2.8.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: settlement-api
          image: ghcr.io/northstar/settlement-api:2.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            # Explicitly load the production runtime settings supplied by the ConfigMap.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/settlement/config/application-prod.yml
            - name: PARTNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: settlement-api-runtime
                  key: PARTNER_API_TOKEN
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/settlement/config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: runtime-config
          configMap:
            name: settlement-api-config
      terminationGracePeriodSeconds: 30
