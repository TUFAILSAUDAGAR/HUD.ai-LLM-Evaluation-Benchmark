apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: settlement-api
  namespace: payments-production
  labels:
    app.kubernetes.io/name: settlement-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [settlements.api.northstar.example]
      secretName: northstar-api-tls
  rules:
    - host: settlements.api.northstar.example
      http:
        paths:
          - path: /v1/settlements
            pathType: Prefix
            backend:
              service:
                name: settlement-api
                port:
                  name: http
