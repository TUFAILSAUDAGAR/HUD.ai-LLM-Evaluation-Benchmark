apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: commerce-production
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/version: 3.4.0
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/version: 3.4.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: ghcr.io/northstar/inventory-service:3.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/inventory/config/application-prod.properties
            - name: INVENTORY_PARTNER_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: inventory-service-runtime
                  key: INVENTORY_PARTNER_AUDIENCE
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/inventory/config
              readOnly: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: runtime-config
          configMap: {name: inventory-service-config}
      terminationGracePeriodSeconds: 30
